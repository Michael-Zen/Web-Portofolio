<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
      Mondrian Project
    </title>
    <style>
      /* 
    Write your CSS here 
    Gap Colour: #000
    White: #F0F1EC
    Red: #E72F24
    Black: #232629
    Blue: #004592
    Yellow: #F9D01E

    For dimensions, see dimensions.png image.
    HINT: Remember you can't change the properties of grid lines.
    But grid lines are transparent!
    */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #fff;
    }

    .composition {
      width: 748px;
      height: 748px;
      display: grid;
      grid-template-columns: 320px 198px 153px 50px;
      grid-template-rows: 414px 130px 155px 20px;
      gap: 9px;
      background: #000;
    }

    .panel {
      background: #F0F1EC;
    }

    .red {
      grid-row: 1;
      grid-column: 1;
      background: #E72F24;
    }

    .large-white {
      grid-column: 2 / 5;
      grid-row: 1;
    }

    .left-white {
      grid-column: 1;
      grid-row: 2 / 5;
    }

    .middle-white {
      grid-column: 2 / 4;
      grid-row: 2 / 4;
    }

    .blue {
      grid-column: 4;
      grid-row: 2;
      background: #004592;
    }

    .yellow {
      grid-column: 2;
      grid-row: 4;
      background: #F9D01E;
    }

    .right-white {
      grid-column: 4;
      grid-row: 3 / 5;
    }

    .black {
      grid-column: 3;
      grid-row: 4;
      background: #232629;
    }
    </style>
  </head>
  <body>
    <main class="composition" aria-label="Mondrian-inspired composition">
      <div class="panel red">
      </div>
      <div class="panel large-white">
      </div>
      <div class="panel left-white">
      </div>
      <div class="panel middle-white">
      </div>
      <div class="panel blue">
      </div>
      <div class="panel yellow">
      </div>
      <div class="panel right-white">
      </div>
      <div class="panel black">
      </div>
    </main>
  </body>
</html>
